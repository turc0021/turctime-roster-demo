<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TurcTime Training – Roster</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>⚾ TurcTime Training</h1><p>Roster &amp; Session Manager · Wake Forest, NC</p>
<nav><button data-tab="roster" class="active">Roster</button><button data-tab="sessions">Sessions</button><button data-tab="reports">Reports</button></nav></header>
<main>
<section id="roster" class="tab active">
 <div class="bar"><input id="search" placeholder="Search players…"><button id="addPlayer" class="primary">+ Add Player</button></div>
 <div id="playerList" class="cards"></div>
</section>
<section id="sessions" class="tab">
 <form id="sessionForm" class="panel"><h2>Log Session</h2>
  <label>Player<select name="playerId" required></select></label>
  <label>Date<input type="date" name="date" required></label>
  <label>Type<select name="type"><option>Hitting</option><option>Positional</option><option>Pitching</option><option>Virtual</option><option>Strength/Speed</option></select></label>
  <label>Duration (min)<input type="number" name="duration" value="60" min="5" required></label>
  <label class="full">Notes<textarea name="notes" rows="2"></textarea></label>
  <button class="primary">Log Session</button></form>
 <h2>Recent Sessions</h2><div class="tablewrap"><table id="sessionTable"><thead><tr><th>Date</th><th>Player</th><th>Type</th><th>Min</th><th>Notes</th><th></th></tr></thead><tbody></tbody></table></div>
</section>
<section id="reports" class="tab">
 <div class="panel noprint"><label>From<input type="date" id="rFrom"></label><label>To<input type="date" id="rTo"></label>
  <button id="exportCsv" class="primary">Export CSV</button><button id="printBtn">Print</button></div>
 <h2 id="reportTitle">Sessions per Player</h2>
 <div class="tablewrap"><table id="reportTable"><thead><tr><th>Player</th><th>Team</th><th>Sessions</th><th>Total Min</th><th>Hitting</th><th>Positional</th><th>Pitching</th><th>Virtual</th><th>Other</th><th>Last</th></tr></thead><tbody></tbody><tfoot></tfoot></table></div>
</section>
</main>
<footer class="noprint"><button id="resetDemo" class="danger">Reset demo data</button> <small>Data is stored in this browser only (localStorage).</small></footer>
<dialog id="playerDialog"><form id="playerForm" method="dialog"><h2 id="pdTitle">Player</h2><input type="hidden" name="id">
 <fieldset><legend>Player</legend><label>Name<input name="name" required></label><label>Age<input type="number" name="age" min="4" max="25"></label>
 <label>Position<input name="position"></label><label>Team<input name="team"></label><label>Phone<input name="phone" type="tel"></label><label>Email<input name="email" type="email"></label></fieldset>
 <fieldset><legend>Parent / Guardian</legend><label>Name<input name="guardianName"></label><label>Phone<input name="guardianPhone" type="tel"></label><label>Email<input name="guardianEmail" type="email"></label></fieldset>
 <label class="full">Notes<textarea name="notes" rows="2"></textarea></label>
 <div class="actions"><button type="button" id="pdCancel">Cancel</button><button class="primary" value="save">Save</button></div></form></dialog>
<script src="app.js"></script></body></html>
